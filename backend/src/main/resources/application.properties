spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library?characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:library_app}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
library.admin.username=${ADMIN_USERNAME:admin}
library.admin.password=${ADMIN_PASSWORD:}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
